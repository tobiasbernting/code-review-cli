name: release

# Immutable releases are enabled on this repository, so a published release
# cannot gain assets or have its body edited afterwards. Whoever creates the
# release must therefore create it complete, in one shot — which has to be
# GoReleaser, since it is the one with the binaries.
#
# So release-please only manages the release pull request and the changelog.
# Merging that pull request makes this workflow create the tag, and the tag
# makes GoReleaser publish the release with its artifacts.
#
# The tag is pushed with RELEASE_PLEASE_TOKEN rather than GITHUB_TOKEN,
# because GitHub does not trigger workflows for anything the built-in token
# pushes — the goreleaser job would never run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GoReleaser creates the GitHub release; see the note above.
          skip-github-release: true

  # Tags whatever version the manifest names, if that tag does not exist yet.
  # Reading the manifest rather than the action's output means a release that
  # was interrupted halfway is picked up by the next run instead of needing a
  # tag pushed by hand.
  tag:
    needs: release-please
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: tag the manifest version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "no version in .release-please-manifest.json"
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists — nothing to do"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "tagged $tag"

  goreleaser:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
