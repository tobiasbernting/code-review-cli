name: release

# release-please accumulates merged pull requests into a release pull request
# with a generated changelog. Merging that pull request tags the version, and
# the same run then builds and uploads the binaries.
#
# Tagging and building live in one workflow on purpose: a tag pushed by
# GITHUB_TOKEN does not trigger other workflows, so a separate tag-triggered
# release job would silently never run.
#
# The same rule is why release-please needs RELEASE_PLEASE_TOKEN: a release
# pull request opened with GITHUB_TOKEN gets no check runs, and main requires
# ci and pr-title to pass, so it could never be merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Falls back to GITHUB_TOKEN so the workflow still runs without the
          # secret — it just produces a release pull request nobody can merge.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tag release-please just created, not the branch head,
          # and take the full history so the version stamp is right.
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
