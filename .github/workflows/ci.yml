name: ci

# Pull requests only. Pushing a branch and opening a pull request would
# otherwise run this twice, and main has already been checked by the pull
# request that produced it.
#
# There is no fork exposure: the job below skips pull requests from forks, and
# the repository requires approval for outside collaborators.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # All three platforms are built because the source is platform-specific:
      # gitsrc has separate Windows and Unix files behind build tags.
      - run: go build ./...

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

  # A single check to require in the branch ruleset. Matrix jobs each produce
  # their own context name, which would mean re-editing the ruleset every time
  # the matrix changes.
  ci:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: verify build matrix succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build matrix result: ${{ needs.build.result }}"
            exit 1
          fi
