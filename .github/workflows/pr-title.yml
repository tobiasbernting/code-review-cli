name: pr-title

# The squash-merge title becomes the commit message on main, and
# release-please reads those messages to decide the next version. A bad title
# therefore produces a wrong release, so it is checked before merge rather
# than discovered after.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    # Fork pull requests are skipped: this repository is public, and no job
    # here should run on a contributor's behalf. The job checks out nothing
    # and runs no repository code, but skipping keeps the runner unused.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: check conventional commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
            exit 0
          fi
          cat >&2 <<'MSG'
          The pull request title must be a conventional commit.

            <type>[optional scope][!]: <description>

          Types and what they release:

            feat:      new behaviour        -> minor version
            fix:       bug fix              -> patch version
            perf:      faster, same output  -> patch version
            feat!:     breaking change      -> minor while 0.x, major after 1.0
            refactor, docs, test, build, ci, chore, revert -> no release

          Examples:

            feat: show teammates' review comments inline
            fix(render): stop tabs shifting the gutter
            chore: bump chroma to v2.28.0
          MSG
          echo "got: $TITLE" >&2
          exit 1
